[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-sme"
version = "0.1.0"
description = "Data warehouse da oferta escolar e da demanda não atendida na rede municipal de educação de São Paulo (SCC0245, ICMC-USP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # O DuckDB 2.0.0 erra a soma de colunas pequenas (SMALLINT) quando a consulta tem janela e ORDER BY:
    # a C3 falha com erro de conversão ou devolve -46 no lugar de 4.050. Rever quando sair correção;
    # o teste test_c3_soma_certa_em_volume pega a regressão.
    "duckdb>=1.1,<2",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
dw-sme = "dw_sme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dw_sme = ["sql/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "dados_reais: depende dos arquivos baixados em data/ (pulado quando ausentes)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ"]
# if/else de duas linhas lê melhor que um ternário longo
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# linhas de dados sintéticos nas fixtures ficam inteiras, uma por registro
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dw_sme"]
known-local-folder = ["conftest", "test_extracao"]

[tool.coverage.run]
source = ["dw_sme"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
