[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-sme"
version = "0.1.0"
description = "Data warehouse da oferta escolar e da demanda não atendida na rede municipal de educação de São Paulo (SCC0245, ICMC-USP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
dw-sme = "dw_sme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dw_sme = ["sql/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "dados_reais: depende dos arquivos baixados em data/ (pulado quando ausentes)",
]

[tool.coverage.run]
source = ["dw_sme"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
